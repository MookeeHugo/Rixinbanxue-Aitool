repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            package-lock.json|
            pnpm-lock.yaml|
            yarn.lock|
            .*\.min\.js|
            node_modules/.*
          )$
